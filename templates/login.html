{% extends 'base.html' %}
{% load static %}
{% block title %}Вход — Аврора{% endblock %}

{% block content %}
<main class="auth-shell">
    <div class="auth-card fade-in">
        <div class="flex items-center gap-2" style="margin-bottom:1.4rem;">
            <span class="brand-mark"><span></span></span>
            <span class="brand-text">АВРОРА</span>
        </div>
        <p class="eyebrow">С возвращением</p>
        <h1 style="font-family:'Bebas Neue',sans-serif;font-size:2.6rem;line-height:1;color:var(--text);margin:0;">ВХОД</h1>

        <form method="post" action="{% url 'login' %}" style="display:grid;gap:1.1rem;margin-top:1.8rem;">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
            {% endif %}

            <label class="field">
                <span class="field-label">Логин</span>
                {{ form.username }}
            </label>

            <label class="field">
                <span class="field-label">Пароль</span>
                {{ form.password }}
            </label>

            <button type="submit" class="btn btn-primary" style="height:3rem;margin-top:.4rem;">Войти</button>
        </form>

        <p class="text-sm text-muted" style="text-align:center;margin-top:1.4rem;">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
        </p>
    </div>
</main>
{% endblock %}
