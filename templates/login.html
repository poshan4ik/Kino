{% extends 'base.html' %}
{% load static %}
{% block title %}Вход — Аврора{% endblock %}

{% block content %}
<main class="auth-shell" style="min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:3rem 1rem;">
    <div class="panel" style="width:100%;max-width:26rem;padding:2.5rem;">
        <p class="eyebrow">С возвращением</p>
        <h1 style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;line-height:1;color:var(--text);margin:0;">ВХОД</h1>

        <form method="post" action="{% url 'login' %}" style="display:grid;gap:1.25rem;margin-top:2rem;">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
            {% endif %}

            <label class="field">
                <span class="field-label">Логин</span>
                {{ form.username }}
            </label>

            <label class="field">
                <span class="field-label">Пароль</span>
                {{ form.password }}
            </label>

            <button type="submit" class="btn btn-primary" style="height:3rem;border-radius:999px;">Войти</button>
        </form>

        <p style="text-align:center;font-size:.875rem;color:var(--text-muted);margin-top:1.5rem;">
            Нет аккаунта? <a href="{% url 'register' %}" style="color:var(--primary);">Зарегистрироваться</a>
        </p>
    </div>
</main>
{% endblock %}
