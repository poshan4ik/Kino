{% extends 'base.html' %}
{% load static %}
{% block title %}Регистрация — Аврора{% endblock %}

{% block content %}
<main class="auth-shell" style="min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:3rem 1rem;">
    <div class="panel" style="width:100%;max-width:32rem;padding:2.5rem;">
        <p class="eyebrow">Новый зритель</p>
        <h1 style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;line-height:1;color:var(--text);margin:0;">РЕГИСТРАЦИЯ</h1>

        <form method="post" action="{% url 'register' %}" style="display:grid;gap:1.25rem;margin-top:2rem;">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
            {% endif %}

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <label class="field">
                    <span class="field-label">Имя</span>
                    {{ form.first_name }}
                </label>
                <label class="field">
                    <span class="field-label">Фамилия</span>
                    {{ form.last_name }}
                </label>
            </div>

            <label class="field">
                <span class="field-label">Email</span>
                {{ form.email }}
            </label>

            <label class="field">
                <span class="field-label">Телефон</span>
                {{ form.phone }}
            </label>

            <label class="field">
                <span class="field-label">Логин</span>
                {{ form.username }}
            </label>

            <label class="field">
                <span class="field-label">Пароль</span>
                {{ form.password1 }}
            </label>

            <label class="field">
                <span class="field-label">Повторите пароль</span>
                {{ form.password2 }}
            </label>

            <label style="display:flex;align-items:flex-start;gap:.5rem;font-size:.8125rem;color:var(--text-muted);">
                {{ form.terms }}
                <span>Соглашаюсь с условиями использования и обработкой персональных данных</span>
            </label>

            <button type="submit" class="btn btn-primary" style="height:3rem;border-radius:999px;">Создать аккаунт</button>
        </form>

        <p style="text-align:center;font-size:.875rem;color:var(--text-muted);margin-top:1.5rem;">
            Уже есть аккаунт? <a href="{% url 'login' %}" style="color:var(--primary);">Войти</a>
        </p>
    </div>
</main>
{% endblock %}
