{% extends 'base.html' %}
{% load static %}
{% block title %}Регистрация — Аврора{% endblock %}

{% block content %}
<main class="auth-shell">
    <div class="auth-card wide fade-in">
        <div class="flex items-center gap-2" style="margin-bottom:1.4rem;">
            <span class="brand-mark"><span></span></span>
            <span class="brand-text">АВРОРА</span>
        </div>
        <p class="eyebrow">Новый зритель</p>
        <h1 style="font-size:2.6rem;line-height:1;color:var(--text);margin:0;">РЕГИСТРАЦИЯ</h1>

        <form method="post" action="{% url 'register' %}" style="display:grid;gap:1.1rem;margin-top:1.8rem;">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-error">{{ form.non_field_errors }}</div>
            {% endif %}

            <div class="grid-2" style="gap:1rem;">
                <label class="field">
                    <span class="field-label">Имя</span>
                    {{ form.first_name }}
                </label>
                <label class="field">
                    <span class="field-label">Фамилия</span>
                    {{ form.last_name }}
                </label>
            </div>

            <label class="field">
                <span class="field-label">Email</span>
                {{ form.email }}
            </label>

            <label class="field">
                <span class="field-label">Телефон</span>
                {{ form.phone }}
            </label>

            <label class="field">
                <span class="field-label">Логин</span>
                {{ form.username }}
            </label>

            <div class="grid-2" style="gap:1rem;">
                <label class="field">
                    <span class="field-label">Пароль</span>
                    {{ form.password1 }}
                </label>
                <label class="field">
                    <span class="field-label">Повторите пароль</span>
                    {{ form.password2 }}
                </label>
            </div>

            <label class="flex items-start gap-2 text-xs text-muted" style="cursor:pointer;">
                {{ form.terms }}
                <span>Соглашаюсь с условиями использования и обработкой персональных данных</span>
            </label>

            <button type="submit" class="btn btn-primary" style="height:3rem;margin-top:.4rem;">Создать аккаунт</button>
        </form>

        <p class="text-sm text-muted" style="text-align:center;margin-top:1.4rem;">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </p>
    </div>
</main>
{% endblock %}
