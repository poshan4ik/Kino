        schema:
          type: string
      - in: query
        name: session
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: Статус
          enum:
          - cancelled
          - created
          - expired
          - paid
          - pending_payment
          - used
        description: |-
          * `created` - Создано
          * `pending_payment` - Ожидает оплаты
          * `paid` - Оплачено
          * `used` - Использовано
          * `cancelled` - Отменено
          * `expired` - Просрочено
      tags:
      - api
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: api_bookings_create
      tags:
      - api
