components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Имя пользователя
        password:
          type: string
          writeOnly: true
          title: Пароль
        token:
          type: string
          readOnly: true
          title: Токен
      required:
      - password
      - token
      - username
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
          title: Клиент
        client_name:
          type: string
          readOnly: true
        client_username:
          type: string
          readOnly: true
        session:
          type: integer
          readOnly: true
          title: Сеанс
        session_info:
          allOf:
          - $ref: '#/components/schemas/SessionList'
          readOnly: true
        seat:
          type: integer
          readOnly: true
          title: Место
        seat_info:
          allOf:
          - $ref: '#/components/schemas/Seat'
          readOnly: true
        ticket_type:
          type: integer
          nullable: true
          title: Тип билета
        ticket_type_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatus'
          readOnly: true
          title: Статус
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Истекает
        ticket:
          type: object
          nullable: true
          readOnly: true
      required:
      - client
      - client_name
      - client_username
      - created_at
      - expires_at
      - id
      - seat
      - seat_info
      - session
      - session_info
      - status
      - ticket
      - ticket_type_name
    BookingCreate:
      type: object
      properties:
        session:
          type: integer
          title: Сеанс
        seat:
          type: integer
          title: Место
      required:
      - seat
      - session
    BookingStatus:
      enum:
      - created
      - pending_payment
      - paid
      - used
      - cancelled
      - expired
      type: string
      description: |-
        * `created` - Создано
        * `pending_payment` - Ожидает оплаты
        * `paid` - Оплачено
        * `used` - Использовано
        * `cancelled` - Отменено
        * `expired` - Просрочено
    CategoryEnum:
      enum:
      - standard
      - comfort
      - vip
      type: string
      description: |-
        * `standard` - Стандарт
        * `comfort` - Комфорт
        * `vip` - VIP
    DashboardStats:
      type: object
      properties:
        sessions_today:
          type: integer
        tickets_sold:
          type: integer
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        occupancy_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        movies_active:
          type: integer
        halls_total:
          type: integer
      required:
      - halls_total
      - movies_active
      - occupancy_rate
      - revenue
      - sessions_today
      - tickets_sold
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        movie:
          type: integer
          title: Фильм
        movie_title:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Добавлено
      required:
      - created_at
      - id
      - movie
      - movie_title
    Genre:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 100
        description:
          type: string
          title: Описание
        movies_count:
          type: integer
          readOnly: true
      required:
      - id
      - movies_count
      - name
    Hall:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: integer
          title: Номер зала
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: Тип зала
        capacity:
          type: integer
          minimum: 1
          title: Вместимость
        description:
          type: string
          title: Описание
        seats_count:
          type: integer
          readOnly: true
        sessions_count:
          type: integer
          readOnly: true
      required:
      - capacity
      - id
      - number
      - seats_count
      - sessions_count
    HoldRequest:
      type: object
      description: Тело POST /api/bookings/hold/.
      properties:
        session:
          type: integer
        seats:
          type: array
          items:
            type: integer
          description: ID мест (не больше BOOKING_MAX_SEATS)
          maxItems: 10
          minItems: 1
        ticket_type:
          type: integer
          nullable: true
          description: ID типа билета (скидка); без него — взрослый
      required:
      - seats
      - session
    Movie:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 255
        genre:
          type: integer
          title: Жанр
        genre_name:
          type: string
          readOnly: true
        duration:
          type: integer
          minimum: 1
          title: Длительность (мин)
        age_rating:
          type: integer
          maximum: 21
          minimum: 0
          title: Возрастное ограничение
        description:
          type: string
          title: Описание
        poster:
          type: string
          format: uri
          nullable: true
          title: Постер
        poster_url:
          type: string
          format: uri
          readOnly: true
        trailer_url:
          type: string
          format: uri
          title: Ссылка на трейлер (YouTube)
          description: 'Например: https://www.youtube.com/watch?v=…'
          maxLength: 300
        status:
          allOf:
          - $ref: '#/components/schemas/MovieStatus'
          title: Статус проката
        sessions_count:
          type: integer
          readOnly: true
        rating:
          type: number
          format: double
          readOnly: true
        reviews_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_rating
      - created_at
      - duration
      - genre
      - genre_name
      - id
      - poster_url
      - rating
      - reviews_count
      - sessions_count
      - title
      - updated_at
    MovieList:
      type: object
      properties:
